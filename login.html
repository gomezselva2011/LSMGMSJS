<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar — Gastos del hogar</title>
    <style>
      html,body{margin:0;min-height:100%;background:#f3eee4;color:#1b2a4e}
      [hidden]{display:none!important}
    </style>
    <link rel="stylesheet" href="/boot.css" />
    <link rel="preload" as="image" href="/lm-mark.jpg" />
    <script>
      function lmPhotoErr(img) {
        if (!img) return
        if (img.dataset.lmfb === 'mark') {
          img.onerror = null
          img.src =
            "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect width='96' height='96' rx='12' fill='%23f7f4ee'/%3E%3Ctext x='48' y='56' text-anchor='middle' font-family='Georgia,serif' font-size='20' fill='%231b2a4e'%3EL%26amp;M%3C/text%3E%3C/svg%3E"
          return
        }
        img.dataset.lmfb = 'mark'
        img.src = '/lm-mark.jpg'
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,620;9..144,680&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="boot" id="login">
      <article class="boot-folio login-folio">
        <img
          class="boot-hero"
          src="/lm-mark.jpg"
          width="840"
          height="840"
          alt="L y M, 29 de octubre"
          onerror="lmPhotoErr(this)"
        />
        <p class="boot-kicker">Gastos del hogar</p>
        <h1>Entrar al presupuesto</h1>
        <p>Melissa y Lenin</p>
        <form id="login-form" class="login-form" novalidate>
          <div class="login-field">
            <label for="login-username">Usuario</label>
            <input
              id="login-username"
              name="username"
              type="text"
              autocomplete="username"
              required
              maxlength="32"
              spellcheck="false"
            />
          </div>
          <div class="login-field">
            <label for="login-password">Contraseña</label>
            <div class="login-password-wrap" data-password-wrap>
              <input
                id="login-password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="login-password-toggle"
                id="login-password-toggle"
                data-password-toggle
                aria-label="Mostrar contraseña"
                title="Mostrar contraseña"
                aria-controls="login-password"
                aria-pressed="false"
              >
                <svg class="login-eye eye-show" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M2.5 12s3.6-6.5 9.5-6.5S21.5 12 21.5 12s-3.6 6.5-9.5 6.5S2.5 12 2.5 12Z"
                  />
                  <circle cx="12" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8" />
                </svg>
                <svg class="login-eye eye-hide" viewBox="0 0 24 24" aria-hidden="true" hidden>
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M2.5 12s3.6-6.5 9.5-6.5S21.5 12 21.5 12s-3.6 6.5-9.5 6.5S2.5 12 2.5 12Z"
                  />
                  <circle cx="12" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8" />
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    d="M4 19.5 20 4.5"
                  />
                </svg>
              </button>
            </div>
          </div>
          <p id="login-error" class="login-error" hidden></p>
          <button type="submit" class="btn btn-primary btn-cta" id="login-submit">Entrar</button>
        </form>
      </article>
    </div>
    <script type="module" src="/src/login.js"></script>
  </body>
</html>
